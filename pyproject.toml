[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshlens"
dynamic = ["version"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "paho-mqtt>=2.1",
    "meshtastic==2.7.11",
    "cryptography>=42",
    "shapely>=2.0",  # porta con sé numpy, usato da elevation/prediction
    "argon2-cffi",
    "pmtiles>=3.8.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]
tray = ["pystray", "Pillow"]

[project.scripts]
meshlens = "meshlens.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "meshlens.__version__"}

[tool.setuptools]
package-dir = {"" = "server"}

[tool.setuptools.packages.find]
where = ["server"]

[tool.setuptools.package-data]
meshlens = ["data/*.geojson", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
